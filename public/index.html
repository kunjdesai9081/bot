<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social AI Support Agent API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }
    .badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .endpoints {
      background: #0f172a;
      border-radius: 10px;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .endpoint {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid #1e293b;
    }
    .endpoint:last-child { border-bottom: none; }
    .method {
      background: #2563eb;
      color: white;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.75rem;
    }
    .method.post { background: #059669; }
    .footer {
      font-size: 0.8rem;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="dot"></span>
      System Active & Operational
    </div>
    <h1>Social AI Support Agent</h1>
    <p>Powered by Google Agent Development Kit (Gemini Flash), Supabase pgvector, and Telegram Human-in-the-Loop confirmation.</p>
    
    <div class="endpoints">
      <div class="endpoint">
        <span>/api/webhook</span>
        <span class="method">GET / POST</span>
      </div>
      <div class="endpoint">
        <span>/api/telegram</span>
        <span class="method post">POST</span>
      </div>
    </div>

    <div class="footer">
      Vercel Serverless Gateway &bull; Free Tier Architecture
    </div>
  </div>
</body>
</html>
